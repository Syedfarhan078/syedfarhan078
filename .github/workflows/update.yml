name: Update Profile SVGs

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'config.py'
      - 'generate.py'
      - 'templates/**'
      - 'assets/**'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential to allow pushing the generated SVGs back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate SVGs
      run: |
        python generate.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if there are changes
        git add dark_mode.svg light_mode.svg assets/profile.png
        
        if git diff --staged --quiet; then
          echo "No changes in generated files. Skipping commit."
        else
          git commit -m "chore: auto-generate latest profile terminal SVGs"
          git push
        fi
